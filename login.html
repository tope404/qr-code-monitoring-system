<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR-Code Monitoring System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <div class="shell">
        <!-- Header -->
        <header class="app-header">
            <div class="header-row">
                <div class="brand">
                    <div class="logo"><i class="ms">home_pin</i></div>
                    <div>
                        <b>Boarding House</b>
                        <div class="mu xs">Rang-Ayan, Roxas, Isabela</div>
                    </div>
                </div>
                <button class="icon-btn" onclick="toggleTheme()" title="Toggle light/dark theme">
                    <i class="ms" id="theme-icon">dark_mode</i>
                </button>
            </div>
        </header>

        <!-- Sign in / registration views are rendered here by auth.js -->
        <main id="auth-content" class="auth-main"></main>

        <footer class="page-footer">Group 5 – BSIT 2D | Creative &amp; Critical Thinking (IT Inst 2)</footer>

        <!-- Toasts -->
        <div id="toast-container" class="toast-wrap"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
</body>
</html>
