<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>QR-Code Monitoring System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <div class="shell">
        <!-- Header -->
        <header class="app-header">
            <div class="header-row">
                <div class="brand">
                    <div class="logo"><i class="ms">home_pin</i></div>
                    <div>
                        <b id="brand-name">Boarding House</b>
                        <span class="pill ok">BOARDER</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="logout()" title="Sign out">
                        <i class="ms">logout</i>
                    </button>
                    <button class="icon-btn" onclick="toggleTheme()" title="Toggle light/dark theme">
                        <i class="ms" id="theme-icon">dark_mode</i>
                    </button>
                </div>
            </div>
            <div class="header-row header-meta">
                <div>
                    <div id="date" class="date">--</div>
                    <div class="mu xs">QR-Code Monitoring System</div>
                </div>
                <div class="clock-wrap">
                    <div id="clock" class="clock">--</div>
                    <span id="cf" class="pill">Checking…</span>
                </div>
            </div>
        </header>

        <!-- Tab views are rendered here by user.js -->
        <main class="page">
            <div class="page-title">
                <h1 id="title"></h1>
                <p id="sub"></p>
            </div>
            <div id="view" class="stack"></div>
        </main>

        <!-- Bottom navigation (rendered by user.js) -->
        <nav id="nav" class="bottom-nav"></nav>
    </div>

    <!-- Modals and toasts -->
    <div id="ov"></div>
    <div id="toasts" class="toast-stack"></div>


    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script src="user.js"></script>
</body>
</html>
